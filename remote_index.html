<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สวนคุณแดงการ์เด้น (Khun Daeng Garden)</title>
    <meta http-equiv="refresh" content="0;url=https://khun-daeng-garden.vercel.app/">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0fdf4;
            color: #166534;
            text-align: center;
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #166534;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        window.location.href = "https://khun-daeng-garden.vercel.app/";
    </script>
</head>
<body>
    <div>
        <div class="loader"></div>
        <h1>กำลังเข้าสู่เว็บไซต์สวนคุณแดงการ์เด้น...</h1>
        <p>หากหน้านี้ไม่เปลี่ยนอัตโนมัติ <a href="https://khun-daeng-garden.vercel.app/">คลิกที่นี่</a></p>
    </div>
</body>
</html>
